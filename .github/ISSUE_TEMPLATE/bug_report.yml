name: Bug report
description: Report a reproducible recording, replay, compatibility, or lifecycle defect.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data in reproductions. Do not attach real cassettes, prompts, outputs, or credentials. Report possible security vulnerabilities privately through SECURITY.md.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: This report contains no credentials, private prompts, or real cassette data.
          required: true
        - label: I can reproduce this with the supported Node.js and DSH versions.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include the smallest request, provider behavior, and record/replay config that demonstrates the issue.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include the error code, stop reason, CLI verification output, and call-key metadata where relevant. Do not include prompt or result bodies.
      render: text
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: dsh-subagent-cassette version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.0-rc.7
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      placeholder: Node 22.19.0, pnpm 11.19.0, Windows 11 x64
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Upstream provider, write mode, timing mode, cancellation timing, or regression range.
